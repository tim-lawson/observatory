[project]
name = "expgen"
version = "0.0.1"
description = "explanation generation and scoring pipeline"

requires-python = "==3.12.*"
dependencies = [
    "activations",
    "explanations",
    "jupyter>=1.0.0",
    "sparse-autoencoders",
    "statsmodels>=0.14.0",
    "util",
]

[tool.uv.sources]
activations = { path = "../../lib/activations", editable = true }
explanations = { path = "../../lib/explanations", editable = true }
sparse-autoencoders = { path = "../../lib/sparse_autoencoders", editable = true }
util = { path = "../../lib/util", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expgen"]

[tool.pyright]
strict = ["expgen"]
reportMissingTypeStubs = false

[tool.hatch.metadata]
allow-direct-references = true
